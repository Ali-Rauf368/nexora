# Full stack for a single server or local trial: docker compose -f infra/docker-compose.yml up -d
# Production replaces the "ldap" service with the company's Active Directory (set LDAP_* in .env).
name: nexora

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: nexora
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U nexora"], interval: 5s, retries: 20 }
    restart: unless-stopped

  mongo:
    image: mongo:8
    volumes: [mongodata:/data/db]
    healthcheck: { test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"], interval: 5s, retries: 20 }
    restart: unless-stopped

  ldap:
    # Mock Active Directory for trials only.
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ["node", "-e", "require('./dist/scripts/dev-ldap.js')"]
    profiles: [demo]
    restart: unless-stopped

  migrate:
    image: ${NEXORA_REGISTRY:-ghcr.io/rheinwerk/nexora}/api:${NEXORA_TAG:-latest}
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/scripts/analytics-setup.js"]
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD}@postgres:5432/nexora
      MONGO_URL: mongodb://mongo:27017/nexora
    depends_on: { postgres: { condition: service_healthy } }

  api:
    image: ${NEXORA_REGISTRY:-ghcr.io/rheinwerk/nexora}/api:${NEXORA_TAG:-latest}
    build: { context: .., dockerfile: infra/docker/api.Dockerfile }
    env_file: ../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://nexora:${POSTGRES_PASSWORD}@postgres:5432/nexora
      MONGO_URL: mongodb://mongo:27017/nexora
      TRUST_PROXY: "1"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  web:
    image: ${NEXORA_REGISTRY:-ghcr.io/rheinwerk/nexora}/web:${NEXORA_TAG:-latest}
    build: { context: .., dockerfile: infra/docker/web.Dockerfile }
    ports: ["${NEXORA_PORT:-8080}:80"]
    depends_on: [api]
    restart: unless-stopped

  nifi:
    image: apache/nifi:2.12.0
    ports: ["8443:8443"]
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?set NIFI_PASSWORD (12+ chars)}
      NIFI_JVM_HEAP_MAX: 2g
      NEXORA_API_URL: http://api:4100
      NEXORA_INGEST_API_KEY: ${INGEST_API_KEY}
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - ../nifi/inbox:/data/erp-export
    profiles: [integration]
    restart: unless-stopped

volumes:
  pgdata:
  mongodata:
  nifi_conf:
  nifi_state:
