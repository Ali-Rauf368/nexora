name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: API tests (Jest + Supertest, disposable Postgres/MongoDB/LDAP)
        run: npm -w apps/api test -- --coverage
        env: { PGBIN: /usr/lib/postgresql/16/bin }
      - name: Web tests (Jest + React Testing Library)
        run: npm -w apps/web test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: "apps/*/coverage", retention-days: 7 }

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y postgresql-16
      - run: npm ci
      - run: npx -w e2e playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { PGBIN: /usr/lib/postgresql/16/bin }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: e2e/playwright-report, retention-days: 7 }

  images:
    name: Build container images
    runs-on: ubuntu-24.04
    needs: [quality, e2e]
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }},ghcr.io/${{ github.repository }}/api:latest
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }},ghcr.io/${{ github.repository }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-24.04
    needs: images
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Roll out over SSH (pull images, migrate, restart)
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          HOST: ${{ vars.STAGING_HOST }}
        run: |
          install -m 600 /dev/null ~/.ssh_key && echo "$SSH_KEY" > ~/.ssh_key
          ssh -i ~/.ssh_key -o StrictHostKeyChecking=accept-new deploy@"$HOST" \
            "cd /opt/nexora && export NEXORA_TAG=${{ github.sha }} && ./infra/deploy.sh"
